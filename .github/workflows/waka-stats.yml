name: Update WakaTime stats

on:
  schedule:
    # Every day at 08:17 in Asia/Shanghai (00:17 UTC).
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Update WakaTime statistics
        uses: anmol098/waka-readme-stats@4db28e08bfd8bac570125799fe1cfdcb23a8c871
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "Update WakaTime stats [skip ci]"
          LOCALE: en
          SHOW_LOC_CHART: "True"
          SHOW_UPDATED_DATE: "True"
